[package]
name = "ptk-public-market"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
rust_decimal = { version = "=1.39.0", default-features = false, features = ["std"] }
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "native-tls"] }

native-tls = "=0.2.18"
